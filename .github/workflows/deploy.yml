name: auto deploy

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        name: auto deploy
        steps:
            # 1. 获取源码
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            # 1b. 初始化子模块（CI 环境无 SSH key，将子模块 URL 临时改为 HTTPS）
            - name: Init submodules
              run: |
                  git config --global url."https://github.com/kmoretti/hexo-theme-flatpaper.git".insteadOf "git@github.com-kmoretti:kmoretti/hexo-theme-flatpaper.git"
                  git submodule update --init --recursive

            # 2. 安装 pnpm
            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8

            # 3. 配置 Node.js 环境
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # 4. 安装依赖
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

            # 5. 安装 Hexo CLI
            - name: Install Hexo CLI
              run: npm install -g hexo-cli

            # 6. 生成 friend.json 并构建
            - name: Generate friend.json
              run: node link.js

            # 8. 构建静态文件
            - name: Generate Public Files
              run: pnpm build

            # 8. 复制 friend.json 到构建产物
            - name: Copy friend.json to public
              run: cp source/friend.json public/friend.json

            # 9. 部署到 GitHub 仓库
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  personal_token: ${{ secrets.GIT_TOKEN }}
                  external_repository: kmoretti/hexo-blog
                  publish_branch: main
                  publish_dir: ./public
                  commit_message: ${{ github.event.head_commit.message }}
                  user_name: "github-actions[bot]"
                  user_email: "github-actions[bot]@users.noreply.github.com"